# Defaults for run_m3. Surface and volume share this file.
# The SHIFT-Wing runs in the paper set weight_v to 0.1.

octree:
  # Deepest split. boundary is the surface.
  boundary_max_level: 8
  volume_max_level: 13

  # Also stop when the cell variation falls to this value.
  boundary_epsilon_refine: 0.05
  volume_epsilon_refine: 0.005

  # Variation is max(weight_p * scalar range, weight_v * vector range).
  weight_p: 1.0
  weight_v: 0.4

  # Scale bins. A cell with one point is placed in the extra bin.
  effective_strata_bins: 64

  # Percentile clip before binning. null keeps the raw minimum or maximum.
  log_strata_quantiles: [null, 99.9]

  # Fixed bin edges. When set, they replace log_strata_quantiles.
  log_strata_fixed_range: null

sampling:
  # Maximum fraction of points taken from one cell. null or >= 1 turns this off.
  max_cell_fill_ratio: 0.3

  # Give unused budget back to scales that still have room.
  enable_inter_level_backflow: true
